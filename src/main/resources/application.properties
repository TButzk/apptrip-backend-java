spring.application.name=apptrip

server.port=${SERVER_PORT:5010}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.show_sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.servlet.multipart.max-file-size=${APPTRIP_UPLOAD_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${APPTRIP_UPLOAD_MAX_REQUEST_SIZE:105MB}

security.secret-key=${SECURITY_SECRET_KEY:bXkgc2VjdXJlIGtleSBmb3IgYXBwdHJpcCBhcHBsaWNhdGlvbiAyMDI1}
geocode.api-key=${GEOCODE_API_KEY:691f70d4b6f7b354059268umf0f8868}

apptrip.uploads.path=${APPTRIP_UPLOADS_PATH:./uploads}
apptrip.uploads.image-max-bytes=${APPTRIP_UPLOAD_IMAGE_MAX_BYTES:10485760}
apptrip.uploads.audio-max-bytes=${APPTRIP_UPLOAD_AUDIO_MAX_BYTES:26214400}
apptrip.uploads.video-max-bytes=${APPTRIP_UPLOAD_VIDEO_MAX_BYTES:104857600}
apptrip.admin.name=${APPTRIP_ADMIN_NAME:}
apptrip.admin.email=${APPTRIP_ADMIN_EMAIL:}
apptrip.admin.password=${APPTRIP_ADMIN_PASSWORD:}
